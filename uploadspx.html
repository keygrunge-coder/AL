<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Retur SPX</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

    .header-box {
    background: #003399; /* Warna biru */
    color: #fff;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
}

.btn-nav {
    background: #cc0000; /* Warna merah */
    color: white;
    border: none;
    padding: 8px 15px;
    font-weight: bold;
    border-radius: 5px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    margin: 5px; /* Memberi jarak antar tombol */
    font-size: 13px;
}
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:700px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
}

input,
button,
select{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    background:#0d6efd;
    color:#fff;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

#hasil{
    margin-top:20px;
    white-space:pre-wrap;
    font-family:monospace;
}
.small{
    font-size:13px;
    color:#333;
}
</style>

</head>
<body>

<div class="container">

<div class="header-box">
<h3> <B>UPLOAD RETUR SPX</B> </h3>
<a href="retur.html" class="btn-nav"> SCAN RETUR</a>
<a href="upload.html" class="btn-nav">UPLOAD RETUR JNT</a>
</div>
<input
type="file"
id="file"
accept=".xlsx,.xls">

<!-- Opsional: masukkan URL proxy jika server target memblokir CORS. Contoh public proxy (tidak direkomendasikan untuk produksi): https://cors-anywhere.herokuapp.com/ -->
<input type="text" id="proxy" placeholder="(Opsional) Proxy prefix, mis. https://cors-anywhere.herokuapp.com/" class="small">

<button onclick="uploadSPX()">
Upload ke RETUR_SPX
</button>

<div id="hasil">
Belum ada file.
</div>

</div>

<script>
// URL Google Apps Script Anda (biarkan sesuai deployment Anda)
const APP_URL = "https://script.google.com/macros/s/AKfycbyuJTOZaFhOZ52fFKPCxFIulD5rTFJb6VehsELtOZgjmaJf0Epc4Jm71gcPVLtE9sJK/exec";

async function uploadSPX(){
    const hasil = document.getElementById("hasil");
    const fileInput = document.getElementById("file");
    const proxyInput = document.getElementById("proxy");

    const file = fileInput.files[0];

    if(!file){
        alert("Pilih file Excel terlebih dahulu.");
        return;
    }

    hasil.innerText = "Membaca file...";

    const reader = new FileReader();

    reader.onload = async function(e){
        try{
            // gunakan array buffer (lebih kompatibel daripada readAsBinaryString)
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });

            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:"" });

            hasil.innerText = "Mengupload " + (rows.length-1) + " data...";

            // siapkan body JSON
            const body = JSON.stringify({ source:"uploadReturSPX", rows: rows });

            // Periksa apakah user mengisi proxy prefix
            let targetUrl = APP_URL;
            const proxyPrefix = (proxyInput && proxyInput.value && proxyInput.value.trim()) ? proxyInput.value.trim() : "";
            if(proxyPrefix){
                // jika user memasukkan proxy, gabungkan prefix + target
                // contoh: proxyPrefix = 'https://cors-anywhere.herokuapp.com/'
                targetUrl = proxyPrefix + APP_URL;
            }

            let response;
            try{
                response = await fetch(targetUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: body
                });
            }catch(fetchErr){
                // Error fetch biasanya karena jaringan atau CORS
                hasil.innerText = "Gagal melakukan fetch: " + fetchErr.toString() + "\n\nJika ini disebabkan oleh CORS, cobalah mengisi Proxy (opsional) di atas dengan proxy yang mengizinkan CORS, atau host halaman ini dan Script di origin yang sama (mis. deploy HTML di Apps Script).";
                console.error("Fetch error:", fetchErr);
                return;
            }

            // Periksa status HTTP
            if(!response.ok){
                const text = await response.text().catch(()=>"");
                hasil.innerText = "Server error: " + response.status + " " + response.statusText + "\n" + text + "\n\nJika ini terkait CORS, coba gunakan Proxy atau host halaman di origin yang sama dengan Apps Script.";
                console.error("Fetch non-ok body:", text);
                return;
            }

            // Parse JSON respons
            let json;
            try{
                json = await response.json();
            }catch(parseErr){
                const txt = await response.text().catch(()=>"(tidak dapat membaca body)");
                hasil.innerText = "Gagal menguraikan JSON dari server: " + parseErr.toString() + "\nResponse body:\n" + txt;
                console.error(parseErr);
                return;
            }

            if(json.status === "success"){
                hasil.innerText = `Upload Berhasil\n\nTotal Data Baru : ${json.total}`;
            } else {
                hasil.innerText = "Respons server:\n" + JSON.stringify(json, null, 2);
            }

        }catch(err){
            hasil.innerText = "Error: " + err.toString();
            console.error(err);
        }
    };

    // baca file sebagai array buffer
    reader.readAsArrayBuffer(file);
}
</script>

</body>
</html>
